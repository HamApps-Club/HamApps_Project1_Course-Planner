<svg xmlns="http://www.w3.org/2000/svg" class="still" style="--fill:#0f366f;background:#0f366f" viewBox="-70 -150 1140 1140" role="img" aria-label="Box cat: Parachute"><style>@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;display=swap");
/* Layout: one navy world like the logo. A big interactive cat up top, then a sheet of animated poses. */
:root {
  --ink: #0b2b5a;      /* page ground */
  --navy: #0f366f;     /* logo navy, card ground */
  --cream: #f8f4ee;    /* logo line work */
  --gold: #e3c06f;     /* logo lid */
  --blush: #f29bb0;    /* hearts */
  --mute: #a9b9d8;     /* secondary text */
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 48px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px; align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1; margin: 0 0 16px; text-wrap: balance; }
.hero h1 span { color: var(--gold); }
.hero p { color: var(--mute); max-width: 42ch; margin: 0 0 10px; }
.hint { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.stage { --fill: var(--navy); width: 100%; max-width: 460px; justify-self: center; cursor: pointer; border: 0; padding: 0; background: var(--navy); border-radius: 28px; }
.stage:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; }
.stage svg { width: 100%; height: auto; display: block; }

/* pose sheet */
h2 { font-family: var(--display); font-weight: 500; font-size: 1.6rem; margin: 0 0 6px; }
.sub { margin: 0 0 16px; color: var(--mute); max-width: 60ch; }
h2 + .grid { margin-top: 16px; }
.demo { --fill: var(--navy); position: relative; height: 440px; border-radius: 22px; overflow: hidden; background: linear-gradient(180deg, var(--navy), #082048); margin-bottom: 16px; }
.demo-layer { position: absolute; inset: 0; }
.demo-layer > div { position: absolute; top: 0; left: 0; will-change: transform; }
.demo-layer svg { width: 100%; height: 100%; display: block; }
.demo-copy { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; pointer-events: none; }
.demo-copy strong { font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 1; color: var(--cream); text-shadow: 0 4px 24px var(--ink); }
.demo-copy span { color: var(--gold); font-weight: 500; text-shadow: 0 2px 12px var(--ink); }
.modes { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(8,32,72,.8); padding: 5px; border-radius: 99px; }
.mode { font: 600 14px var(--body); color: var(--cream); background: transparent; border: 0; border-radius: 99px; padding: 8px 14px; cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.mode:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.chute { fill: var(--gold); stroke: var(--cream); stroke-width: 26; stroke-linejoin: round; }
.thin { fill: none; stroke: var(--cream); stroke-width: 10; stroke-linecap: round; }
.balloon { fill: var(--blush); stroke: var(--cream); stroke-width: 18; }
.bubble { fill: rgba(170, 205, 255, .12); stroke: rgba(248, 244, 238, .75); stroke-width: 14; }
.cloudb { fill: #dfe7f5; }
.plane { fill: var(--cream); }
.plane2 { fill: #cdd5e6; }
.flame { fill: var(--gold); } .flame2 { fill: var(--cream); }
.box { fill: #c79a58; stroke: var(--cream); stroke-width: 30; stroke-linejoin: round; }
.box2 { fill: #a87c40; stroke: var(--cream); stroke-width: 30; stroke-linejoin: round; }
.sign { fill: var(--cream); }
.signtxt { fill: var(--navy); font-family: var(--display); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.card { --fill: var(--navy); background: var(--navy); border-radius: 18px; padding: 12px 12px 16px; display: grid; gap: 6px; align-content: start; }
.card svg { width: 100%; height: auto; aspect-ratio: 1; display: block; max-width: 100%; }
.card h3 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0; padding-inline: 4px; }
.card p { margin: 0; font-size: 14px; color: var(--mute); padding-inline: 4px; }
@media (max-width: 860px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .card h3 { font-size: 1rem; } .card p { font-size: 13px; } }

/* character parts: traced from the logo, in the logo's own 1000 x 856 drawing space */
.ln { fill: none; stroke: var(--cream); stroke-width: 38; stroke-linecap: round; stroke-linejoin: round; }
.solid { fill: var(--cream); }
.lid { fill: var(--gold); }
.body-fill { fill: var(--fill); }
.heart { fill: var(--blush); }
.shadow { fill: #000; opacity: .2; }
.txt { fill: var(--cream); font-family: var(--display); font-weight: 600; }
.gold { fill: var(--gold); }
svg * { transform-box: view-box; }

/* part pivots */
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.ear { transform-origin: 334px 178px; }
.brow { transform-origin: 808px 140px; }
.curlA { transform-origin: 125px 625px; }
.curlB { transform-origin: 385px 822px; }
.rig { transform-origin: 560px 840px; }
.twitch .ear { animation: twitch 3.4s infinite; }
@keyframes twitch { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-9deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-5deg); } }
.float { animation: floatUp 2.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
.float.d1 { animation-delay: .9s; } .float.d2 { animation-delay: 1.7s; }
@keyframes floatUp { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-230px) scale(1); opacity: 0; } }

/* idle (hero) */
.idle .rig { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .98); } }
.idle .curlA { animation: tap 3s ease-in-out infinite; }
@keyframes tap { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-14deg); } 86% { transform: rotate(4deg); } }
.jump .rig { animation: jump .9s cubic-bezier(.3,.7,.4,1) 1; }
@keyframes jump { 0% { transform: scale(1.08,.88); } 30% { transform: translateY(-200px) scale(.95,1.06) rotate(-5deg); } 60% { transform: translateY(0) scale(1.1,.88); } 80% { transform: scale(.97,1.03); } 100% { transform: none; } }

/* hello: the front curl waves */
.p-hello .rig { animation: sway 2.4s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.p-hello .curlA { animation: wave .6s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-38deg) translateY(-20px); } to { transform: rotate(8deg); } }

/* hop */
.p-hop .rig { animation: hop 1.1s infinite; }
@keyframes hop { 0%, 100% { transform: scale(1.08, .9); animation-timing-function: cubic-bezier(.2,.6,.4,1); } 15% { transform: scale(.96, 1.05); } 50% { transform: translateY(-180px) scale(.98, 1.03); animation-timing-function: cubic-bezier(.6,0,.8,.4); } 85% { transform: translateY(0) scale(1, 1); } }
.p-hop .curlA, .p-hop .curlB { animation: kick 1.1s infinite; }
@keyframes kick { 0%, 20%, 85%, 100% { transform: rotate(0); } 50% { transform: rotate(-20deg); } }
.p-hop .shadow { transform-origin: 560px 880px; animation: shadowHop 1.1s infinite; }
@keyframes shadowHop { 0%, 100% { transform: scale(1); } 50% { transform: scale(.6); opacity: .1; } }

/* nap */
.p-nap .rig { animation: snore 3.6s ease-in-out infinite; }
@keyframes snore { 0%, 100% { transform: rotate(-3deg) scale(1, 1); } 50% { transform: rotate(-3deg) scale(1.03, .97); } }
.p-nap .ear { transform: rotate(-14deg); }
.p-nap .brow { transform: rotate(10deg); }
.p-nap .z { animation: zz 3.6s ease-out infinite; opacity: 0; }
.p-nap .z.d1 { animation-delay: 1.2s; } .p-nap .z.d2 { animation-delay: 2.4s; }
@keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(90px, -200px); opacity: 0; } }

/* curious */
.p-curious .rig { animation: tilt 3.2s ease-in-out infinite; }
@keyframes tilt { 0%, 15%, 100% { transform: rotate(0); } 30%, 65% { transform: rotate(-9deg); } 80% { transform: rotate(3deg); } }
.p-curious .brow { animation: browUp 3.2s ease-in-out infinite; }
@keyframes browUp { 0%, 20%, 75%, 100% { transform: rotate(0); } 32%, 65% { transform: rotate(-12deg); } }
.p-curious .q { transform-origin: 950px 40px; animation: qpop 3.2s ease-in-out infinite; }
@keyframes qpop { 0%, 20% { transform: scale(0); } 32% { transform: scale(1.2); } 40%, 66% { transform: scale(1); } 76%, 100% { transform: scale(0); } }
.p-curious .eyes-track { animation: glance 3.2s ease-in-out infinite; }
@keyframes glance { 0%, 25%, 100% { transform: translate(0, 0); } 35%, 65% { transform: translate(24px, -16px); } }

/* love */
.p-love .rig { animation: wiggle 1.6s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-3deg) scale(1.02); } 75% { transform: rotate(3deg) scale(1.02); } }
.p-love .eyes { animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

/* peek */
.p-peek .rig { animation: peek 4s ease-in-out infinite; }
@keyframes peek { 0%, 8%, 100% { transform: translateY(660px); } 22%, 40% { transform: translateY(440px); } 52%, 82% { transform: translateY(90px); } 90% { transform: translateY(660px); } }

/* coding */
.p-code .rig { animation: bob .5s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(10px); } }
.p-code .eyes-track { transform: translateY(26px); }
.p-code .key { animation: keys 1s steps(1) infinite; }
.p-code .key.d1 { animation-delay: .33s; } .p-code .key.d2 { animation-delay: .66s; }
@keyframes keys { 0%, 100% { opacity: 0; } 30% { opacity: 1; } 60% { opacity: 0; } }

/* flip */
.p-flip .rig { animation: flip 1.8s infinite; }
@keyframes flip { 0%, 100% { transform: scale(1.08, .9); } 12% { transform: scale(.96, 1.05); } 25% { transform: translateY(-170px) rotate(0); animation-timing-function: linear; } 55% { transform: translateY(-170px) rotate(360deg); } 70% { transform: translateY(0) rotate(360deg) scale(1.1, .88); } 82% { transform: rotate(360deg) scale(1); } }
.p-flip .rig { transform-origin: 560px 420px; }
.p-flip .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s infinite; }
.p-flip .spark.d1 { animation-delay: .3s; } .p-flip .spark.d2 { animation-delay: .6s; }
@keyframes twinkle { 0%, 40%, 100% { transform: scale(0) rotate(0); } 60% { transform: scale(1) rotate(45deg); } 80% { transform: scale(0) rotate(90deg); } }

/* stretch */
.p-stretch .rig { transform-origin: 972px 840px; animation: stretch 3s ease-in-out infinite; }
@keyframes stretch { 0%, 20%, 100% { transform: none; } 45%, 70% { transform: scale(1.12, .86) skewX(-6deg); } }
.p-stretch .curlA { animation: reach 3s ease-in-out infinite; }
@keyframes reach { 0%, 20%, 100% { transform: none; } 45%, 70% { transform: translateX(-40px) rotate(-32deg); } }
.p-stretch .ear { animation: earBack 3s ease-in-out infinite; }
@keyframes earBack { 0%, 20%, 100% { transform: none; } 45%, 70% { transform: rotate(-12deg); } }

/* zoom */
.p-zoom .rig { animation: run .3s ease-in-out infinite alternate; }
@keyframes run { from { transform: translateY(0) rotate(3deg); } to { transform: translateY(-34px) rotate(5deg); } }
.p-zoom .curlA { animation: legs .3s ease-in-out infinite alternate; }
.p-zoom .curlB { animation: legs .3s ease-in-out infinite alternate-reverse; }
@keyframes legs { from { transform: rotate(-26deg); } to { transform: rotate(20deg); } }
.p-zoom .ear { transform: rotate(-10deg); }
.p-zoom .speed { animation: speed .6s linear infinite; opacity: 0; }
.p-zoom .speed.d1 { animation-delay: .2s; } .p-zoom .speed.d2 { animation-delay: .4s; }
@keyframes speed { 0% { transform: translateX(120px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-180px); opacity: 0; } }

/* startled */
.p-startled .rig { animation: startle 2.6s infinite; }
@keyframes startle { 0%, 55%, 100% { transform: none; } 60% { transform: translateY(-150px) scale(.95, 1.08); } 72% { transform: translateY(-120px); } 85% { transform: translateY(0) scale(1.06, .94); } 92% { transform: none; } }
.p-startled .eyes { animation: eyesPop 2.6s infinite; }
@keyframes eyesPop { 0%, 55%, 92%, 100% { transform: scale(1); } 60%, 85% { transform: scale(.55); } }
.p-startled .ear { animation: earUp 2.6s infinite; }
@keyframes earUp { 0%, 55%, 92%, 100% { transform: none; } 60%, 85% { transform: rotate(8deg); } }
.p-startled .bang { transform-origin: 960px 60px; animation: bang 2.6s infinite; }
@keyframes bang { 0%, 55%, 95%, 100% { transform: scale(0); } 62% { transform: scale(1.3); } 70%, 88% { transform: scale(1); } }

/* roll */
.p-roll .rig { transform-origin: 560px 430px; animation: roll 3.2s linear infinite; }
@keyframes roll { from { transform: translateX(-1150px) rotate(-360deg); } to { transform: translateX(1150px) rotate(360deg); } }

/* dance */
.p-dance .rig { animation: dance 1s ease-in-out infinite; }
@keyframes dance { 0%, 100% { transform: rotate(-7deg); } 25%, 75% { transform: translateY(-55px); } 50% { transform: rotate(7deg); } }
.p-dance .curlA { animation: step .5s ease-in-out infinite alternate; }
.p-dance .curlB { animation: step .5s ease-in-out infinite alternate-reverse; }
@keyframes step { from { transform: rotate(0); } to { transform: rotate(-32deg); } }

/* thinking */
.p-think .rig { animation: ponder 3s ease-in-out infinite; }
@keyframes ponder { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
.p-think .brow { transform: rotate(-12deg); }
.p-think .eyes-track { transform: translate(22px, -24px); }
.p-think .bub { animation: bub 3s infinite; opacity: 0; }
.p-think .bub.d1 { animation-delay: .35s; } .p-think .bub.d2 { animation-delay: .7s; }
@keyframes bub { 0% { opacity: 0; } 15%, 75% { opacity: 1; } 95%, 100% { opacity: 0; } }

/* rainy day */
.p-rain .rig { animation: sigh 4s ease-in-out infinite; }
@keyframes sigh { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .95); } }
.p-rain .ear { transform: rotate(-14deg); }
.p-rain .brow { transform: rotate(12deg); }
.p-rain .eyes { animation: none; transform: translateY(24px) scaleY(.5); }
.p-rain .drop { animation: drop 1s linear infinite; opacity: 0; }
.p-rain .drop.d1 { animation-delay: .33s; } .p-rain .drop.d2 { animation-delay: .66s; }
@keyframes drop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(230px); opacity: 0; } }
.cloud { fill: #c9d4ea; }

/* coffee */
.p-coffee .rig { animation: sway 3s ease-in-out infinite; }
.p-coffee .steam { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
.p-coffee .steam.d1 { animation-delay: .8s; } .p-coffee .steam.d2 { animation-delay: 1.6s; }
@keyframes steam { 0% { transform: translateY(20px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-70px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .float, .z, .key, .bub, .drop, .steam, .speed { opacity: 1 !important; }
}
